<style>
/* VOICE   a working instrument for an engineer: exact, quiet, quick to read
   IDEA    the squared calculation pad: structure in ink, hatched state lines, hand formulas in the margin
   PICTURE the structure with its live moment, shear, axial and deflection lines
   COLOUR  white paper, ink, violet moment, teal shear, rose and blue axial, orange forces
   TYPE    Geist for the sheet, STIX Two Text for the formulas
   LAYOUT  structures on the left, the sheet in the middle, formulas on the right; phone: title, sheet, formulas */
:root{color-scheme:light dark;
--bg:light-dark(#fff,#0f1317);--panel:light-dark(#f2f4f6,#171c22);--ink:light-dark(#131820,#e9edf3);--mute:light-dark(#566170,#9aa4b2);
--line:light-dark(#d9dde4,#2a323d);--grid:light-dark(#eef1f5,#161b22);--grid2:light-dark(#dfe4eb,#202831);
--load:light-dark(#e2560b,#ff9a4d);--cM:light-dark(#6741d9,#a898ff);--cV:light-dark(#0a8f83,#38d3c0);--cT:light-dark(#d6336c,#ff7a9e);--cC:light-dark(#1b6fdc,#69aeff);
--ok:light-dark(#237a36,#57d16c);--amb:light-dark(#a35400,#ffb454);--bad:light-dark(#c42525,#ff7070)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Geist,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--load);outline-offset:2px}
.app{height:100%;display:grid;grid-template:auto minmax(0,1fr)/214px minmax(0,1fr) 356px;grid-template-areas:"top top top" "rail stage learn"}

header{grid-area:top;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{--c:var(--ink);display:flex;align-items:baseline;gap:7px;height:40px;padding:0 14px 0 12px;border:1.5px solid var(--c);border-radius:10px;background:none;color:var(--c);font-weight:600;line-height:37px}
.tab i{font:italic 500 21px "STIX Two Text",Cambria,"Times New Roman",serif}
.tab[data-q=M]{--c:var(--cM)}.tab[data-q=V]{--c:var(--cV)}.tab[data-q=N]{--c:var(--cT)}
.tab:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.tab[aria-selected=true]{background:var(--c);color:var(--bg)}
.tab[data-q=N][aria-selected=true]{background:linear-gradient(100deg,var(--cT) 0 50%,var(--cC) 50% 100%);border-color:transparent}
.tools{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.tools label{display:flex;align-items:center;gap:7px;color:var(--mute)}
select,.btn{height:36px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:0 12px}
select{padding-right:8px}
.btn:hover,select:hover{border-color:var(--ink)}
.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.main{border-color:var(--ink);font-weight:600}
.ei{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
/* with the button "3D" the row of the header is longer: below 1500 px its gaps and the sides of its buttons are a
   little narrower, and below 1460 px the word "Section" before the list of sections goes. So the header keeps one row
   down to 1340 px, whatever the example and the tab */
@media(max-width:1499px){header{gap:10px 13px}.tools{gap:6px}.tools .btn{padding:0 10px}.tools select{padding-left:10px}}
@media(max-width:1459px){.tools label{font-size:0;gap:0}.tools label select{font-size:15px}}
/* narrower than that the buttons take the second row in every state, so that the sheet does not jump when an example with a longer tab is picked */
@media(min-width:761px) and (max-width:1339px){.tools{flex-basis:100%;justify-content:flex-end}}

.rail{grid-area:rail;overflow:auto;padding:6px 10px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.rail h2{margin:8px 6px 1px;font-size:13px;font-weight:600;color:var(--mute)}
.pre{flex:none;display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:0 9px;padding:4px 8px;border:1.5px solid transparent;border-radius:10px;background:none;text-align:left}
.pre svg{grid-row:1/span 2;display:block;width:62px;height:30px;color:var(--ink)}
.pre b{align-self:end;font-size:14px;font-weight:600;line-height:1.2}
.pre span{align-self:start;font-size:13px;color:var(--mute);line-height:1.25}
.pre:hover{background:var(--panel)}
.pre[aria-current=true]{border-color:var(--ink);background:var(--panel)}

.stage{grid-area:stage;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.foot{position:absolute;left:14px;right:14px;bottom:7px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 16px;font-size:13px;color:var(--mute);pointer-events:none}
.foot span:last-child{white-space:nowrap;text-align:right}
.pop{position:absolute;z-index:3;width:232px;display:grid;gap:9px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);box-shadow:0 5px 16px rgb(0 0 0/.16)}
.pop[hidden]{display:none}
.pop.mem{width:282px}
.pop.noq .q{opacity:.5}
.pop small{color:var(--mute);font-size:12.5px;line-height:1.3;margin-top:-3px}
.pop input.bad{border-color:var(--bad)}.pop small.lim{color:var(--bad)}.pop small.lim.soft{color:var(--mute)}
.ph{display:flex;align-items:baseline;gap:8px}
.ph b{font-weight:600}.ph span{color:var(--mute)}.ph b,.ph span{flex:none;white-space:nowrap}
.ph button{width:28px;height:28px;border:0;border-radius:7px;background:none;font-size:20px;line-height:1}
.ph button:first-of-type{margin-left:auto}
.ph button:hover{background:var(--panel)}
.pop label{display:grid;grid-template-columns:1fr 84px 38px;align-items:center;gap:6px}
.pop label.chk{grid-template-columns:auto 1fr;gap:9px}
.pop input[type=number]{height:36px;width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:16px;font-variant-numeric:tabular-nums}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--load)}
.pop label span{color:var(--mute)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{height:36px;border:0;border-left:1.5px solid var(--line);background:none;font-size:16px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--panel)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.txt button,.seg button[data-shape=none]{font-size:14px;padding:0 2px}
.seg svg{display:block;margin:auto}
.wide{min-height:38px;padding:6px 10px;line-height:1.25;border:1.5px solid var(--ink);border-radius:9px;background:none;font-weight:600}
.wide:hover{background:var(--panel)}
.wide.del{border-color:var(--line);font-weight:400;color:var(--bad)}

.side{grid-area:learn;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line)}
/* the 3D view: beside the sheet, in the place of the cards; the column is wider while it is open */
.v3{display:none;position:relative;flex:1 1 auto;min-height:0;background:var(--bg);overflow:hidden}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv3{cursor:grab}#cv3:active{cursor:grabbing}#cv3t{pointer-events:none}
.v3 .btn{position:absolute;right:10px;top:52px;height:30px;padding:0 10px;font-size:13px;background:var(--bg)}
.v3[data-msg]::after{content:attr(data-msg);position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--mute)}
.app[data-v3]{grid-template-columns:214px minmax(0,1fr) clamp(380px,min(40vw,100vw - 854px),780px)}
.app[data-v3] .v3{display:block}.app[data-v3] .learn{display:none}
.learn{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:18px}
.learn h2{margin:0;font-size:22px;line-height:1.12;letter-spacing:-.015em}
.learn .sub{color:var(--mute)}
.badge{--c:var(--ok);display:grid;gap:3px;padding:10px 12px 11px;border-radius:10px;background:color-mix(in srgb,var(--c) 13%,var(--bg))}
.badge b{color:var(--c);font-weight:700}
.badge.ind{--c:var(--amb)}.badge.bad{--c:var(--bad)}
.badge .m{font-size:14px;font-variant-numeric:tabular-nums}
.badge small{font-size:13px;color:var(--mute)}
.card h3{margin:0 0 3px;font-size:14px;font-weight:600}
.card p{margin:0 0 4px;color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1px 10px;padding:7px 0;border-top:1px solid var(--line)}
.f,.rule b,.badge i,.eq i{font-family:"STIX Two Text",Cambria,"Times New Roman",serif}
.f{font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.f sub,.f sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em;line-height:1.18}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.rt{border-top:1.2px solid currentColor;padding:0 2px 0 1px}
.v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.v .ok{color:var(--ok);margin-left:6px}
.v .no{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.s{grid-column:1/-1;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.note{margin:6px 0 0;font-size:13.5px;color:var(--mute)}
.eq{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.eq th{font-weight:400;font-size:13px;color:var(--mute);text-align:right;padding:0 0 3px}
.eq td{padding:5px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.eq td:first-child{text-align:left;font-size:17px}
.eq td:last-child{color:var(--mute);width:74px}
.eq .ok{color:var(--ok);margin-left:6px}
.rule{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.rule b{font-weight:400;font-size:17px;white-space:nowrap}
.rule span{font-size:14px}
.card.q h3{color:var(--c)}
.signs summary{display:flex;align-items:baseline;gap:8px;list-style:none;cursor:pointer;border-radius:6px}
.signs summary::-webkit-details-marker{display:none}
.signs summary h3{margin:0;white-space:nowrap}
.signs summary span{font-size:14px;color:var(--mute)}
.signs summary::after{content:"";flex:none;align-self:center;margin-left:auto;width:8px;height:8px;border:solid var(--mute);border-width:0 1.6px 1.6px 0;transform:translateY(-2px) rotate(45deg)}
.signs[open] summary::after{transform:translateY(2px) rotate(225deg)}
.signs[open] summary{margin-bottom:4px}
.signs[open] summary span{display:none}
.sgs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding-top:9px;border-top:1px solid var(--line)}
.sg svg{display:block;width:96px;height:46px}
.sg p{margin:1px 0 0;font-size:13.5px;line-height:1.35;color:var(--ink)}
.signs .note{margin-top:9px}
.sg b{margin-right:6px;font:400 17px "STIX Two Text",Cambria,"Times New Roman",serif;white-space:nowrap}
.secw{flex:none;border-top:1.5px solid var(--ink);background:var(--bg);font-size:13.5px}
.secw summary{display:flex;align-items:baseline;gap:8px;padding:8px 16px;list-style:none;cursor:pointer}
.secw summary::-webkit-details-marker{display:none}
.secw summary b{flex:none;font-size:15px;font-weight:600;white-space:nowrap}
.secw summary span{color:var(--mute);font-size:13px;line-height:1.25}
.secw summary::after{content:"";flex:none;align-self:center;margin-left:auto;width:8px;height:8px;border:solid var(--mute);border-width:0 1.6px 1.6px 0;transform:translateY(2px) rotate(225deg)}
.secw[open] summary::after{transform:translateY(-2px) rotate(45deg)}
.sb{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:0 8px;padding:0 16px 0 6px}
.sb svg{display:block;width:128px;height:112px;color:var(--mute)}
.sb dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 10px;line-height:1.42;font-variant-numeric:tabular-nums}
.secw sup,.secw sub{font-size:.72em;line-height:0}
.sb dt{color:var(--mute);white-space:nowrap}.sb dd{margin:0;text-align:right;white-space:nowrap;font-weight:600}
.sb dt i,.secw small i{font-family:"STIX Two Text",Cambria,"Times New Roman",serif;font-size:1.12em}
.secw small{display:block;padding:4px 16px 9px;color:var(--mute);font-size:12.5px;line-height:1.3}
.pop label.sel{grid-template-columns:minmax(0,1fr);gap:4px}
.pop select{width:100%;min-width:0}
.scope{padding-top:8px;border-top:1px solid var(--line)}
.try{margin:0;padding:0;list-style:none}
.try li{padding:6px 0;border-top:1px solid var(--line);font-size:14px}

@media(max-width:1180px){
.app{grid-template:auto auto minmax(0,1fr)/minmax(0,1fr) 326px;grid-template-areas:"top top" "rail rail" "stage learn"}
.app[data-v3]{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}

.rail h2{display:none}.pre{width:auto;max-width:214px}
}
@media(max-width:760px){
html,body{height:auto}body{overflow:auto}
.app{height:auto;grid-template:auto auto auto auto auto/minmax(0,1fr);grid-template-areas:"top" "rail" "stage" "sec" "learn"}
.side{display:contents}.learn{grid-area:learn}.secw{grid-area:sec;border-top:1px solid var(--line)}
.app[data-v3]{grid-template:auto auto auto auto auto auto/minmax(0,1fr);grid-template-areas:"top" "rail" "stage" "v3" "sec" "learn"}

.stage{height:min(80svh,680px);min-height:500px}
canvas{touch-action:pan-y}
.learn{overflow:visible;border-top:1px solid var(--line)}
.tools{margin-left:0}.ei{display:none}
.tab{height:38px;padding:0 11px 0 10px;line-height:35px}
}
@media(max-width:480px){
header{padding:10px 12px;gap:8px 10px}
.tabs{gap:5px;flex-wrap:nowrap}.tab{gap:5px;padding:0 8px 0 7px;font-size:14px}.tab i{font-size:19px}
.tools{gap:6px;width:100%}.tools label{font-size:0;gap:0}select,.btn{padding:0 10px}select{font-size:15px}
}
.nb{white-space:nowrap}

<body>
<div class="app">
  <header>
    <h1>Statics Lab</h1>
    <div class="tabs" role="tablist" aria-label="Diagram">
      <button class="tab" role="tab" data-q="M" id="tab-M"><i>M</i>Moment</button>
      <button class="tab" role="tab" data-q="V" id="tab-V"><i>V</i>Shear</button>
      <button class="tab" role="tab" data-q="N" id="tab-N"><i>N</i>Axial</button>
      <button class="tab" role="tab" data-q="D" id="tab-D"><i>w</i>Deflection</button>
    </div>
    <div class="tools">
      <button class="btn main" id="loads" title="Add a point load, or set the distributed load of a member">Loads</button>
      <label for="sec">Section <select id="sec"></select></label>
      <span class="ei" id="ei"></span>
      <button class="btn" id="vals" aria-pressed="true">Values</button>
      <button class="btn" id="cmp" aria-pressed="false" title="Keep the present lines as dashed outlines while you change the structure">Compare</button>
      <button class="btn" id="v3d" aria-pressed="false" title="The structure as a body beside the sheet: profiles, bent shape, stresses">3D</button>
      <button class="btn" id="undo" disabled>Undo</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="theme" aria-pressed="false" title="Dark sheet or light sheet">Dark</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Structures"></nav>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Structure with its diagrams"></canvas>
    <div class="pop" id="pop" hidden></div>
    <div class="foot"><span id="hint"></span><span id="mag"></span></div>
  </main>
  <div class="side">
    <div class="v3" id="v3"><canvas id="cv3" aria-label="The structure in 3D"></canvas><canvas id="cv3t"></canvas><button class="btn" id="v3x" hidden title="Close the cut of the member">Close the cut</button></div>
    <aside class="learn" id="learn" aria-live="off"></aside>
    <details class="secw" id="secw"></details>
  </div>
</div>
<script>
{
/* 2D frame analysis: direct stiffness method, Euler-Bernoulli members with axial and bending stiffness.
   Units: kN, m. Global axes: x right, y up, rotation counter-clockwise.
   Internal forces use the dashed-fibre convention: the dashed fibre lies on the right-hand side of the
   member direction (n1 -> n2). N > 0 tension; M > 0 tension on the dashed fibre; V = dM/dx. */
const FS = (() => {
  const RXN = { fixed: [0, 1, 2], pin: [0, 1], roller: [1], free: [] };

  function geom(model, m) {
    const a = model.nodes[m.n1], b = model.nodes[m.n2];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    return { L, c: dx / L, s: dy / L, x1: a.x, y1: a.y, x2: b.x, y2: b.y };
  }

  function kLocal(EA, EI, L) {
    const a = EA / L, b = 12 * EI / L ** 3, c = 6 * EI / L ** 2, d = 4 * EI / L, e = 2 * EI / L;
    return [
      [a, 0, 0, -a, 0, 0],
      [0, b, c, 0, -b, c],
      [0, c, d, 0, -c, e],
      [-a, 0, 0, a, 0, 0],
      [0, -b, -c, 0, b, -c],
      [0, c, e, 0, -c, d]];
  }

  /* member loads in local axes: point loads {a, px, py} and one distributed load over the full length that runs
     in a straight line from (q1x, q1y) at end 1 to (q2x, q2y) at end 2, per metre; tx, ty are its change per metre */
  function memberLoads(model, mi, g) {
    const pts = [];
    for (const ld of model.loads) {
      if (ld.m !== mi) continue;
      /* the four directions of the menus are exact: cos 90° is not the 6e-17 of the machine, which under 85 loads of 1000 kN
         down a column of 30 m would push the frame 4e-12 m sideways */
      const r = ld.ang * Math.PI / 180; let Fx = ld.P * Math.cos(r), Fy = ld.P * Math.sin(r);
      if (Math.abs(Fx) < 1e-12 * Math.abs(ld.P)) Fx = 0;
      if (Math.abs(Fy) < 1e-12 * Math.abs(ld.P)) Fy = 0;
      let a = Math.min(Math.max(ld.a, 0), g.L);
      /* a load closer than a nanometre to an end of its member stands on that joint: every reading of the member takes it
         so (the last digit of a length such as √18 is not a place of its own) */
      if (a < 1e-9) a = 0; else if (a > g.L - 1e-9) a = g.L;
      else { const same = pts.find(p => Math.abs(p.a - a) < 1e-9); if (same) a = same.a; }   /* and two loads closer than that stand at one place */
      pts.push({ a, px: Fx * g.c + Fy * g.s, py: -Fx * g.s + Fy * g.c, Fx, Fy, id: ld.id });
    }
    pts.sort((p, q) => p.a - q.a);
    const u = model.members[mi].udl;
    let q1x = 0, q1y = 0, q2x = 0, q2y = 0;
    if (u && u.on && (u.w1 || u.w2)) {
      const r = u.ang * Math.PI / 180; let dx = Math.cos(r), dy = Math.sin(r);
      if (Math.abs(dx) < 1e-12) dx = 0;
      if (Math.abs(dy) < 1e-12) dy = 0;
      const lx = dx * g.c + dy * g.s, ly = -dx * g.s + dy * g.c;
      q1x = u.w1 * lx; q1y = u.w1 * ly; q2x = u.w2 * lx; q2y = u.w2 * ly;
    }
    return { pts, q1x, q1y, q2x, q2y, tx: (q2x - q1x) / g.L, ty: (q2y - q1y) / g.L };
  }

  /* fixed-end forces acting on the member (local axes) */
  function fixedEnd(L, ll) {
    const f = [0, 0, 0, 0, 0, 0];
    for (const p of ll.pts) {
      const a = p.a, b = L - a;
      f[0] -= p.px * b / L;
      f[3] -= p.px * a / L;
      f[1] -= p.py * b * b * (3 * a + b) / L ** 3;
      f[2] -= p.py * a * b * b / L ** 2;
      f[4] -= p.py * a * a * (a + 3 * b) / L ** 3;
      f[5] += p.py * a * a * b / L ** 2;
    }
    /* uniform part q1 plus a triangle that rises from zero at end 1 to d = q2 - q1 at end 2 */
    const dx = ll.q2x - ll.q1x, dy = ll.q2y - ll.q1y;
    f[0] -= ll.q1x * L / 2 + dx * L / 6; f[3] -= ll.q1x * L / 2 + dx * L / 3;
    f[1] -= ll.q1y * L / 2 + dy * 3 * L / 20; f[4] -= ll.q1y * L / 2 + dy * 7 * L / 20;
    f[2] -= ll.q1y * L * L / 12 + dy * L * L / 30; f[5] += ll.q1y * L * L / 12 + dy * L * L / 20;
    return f;
  }

  /* static condensation of released end rotations (moment hinges) */
  function condense(k, f, rel) {
    const R = [];
    if (rel[0]) R.push(2);
    if (rel[1]) R.push(5);
    if (!R.length) return;
    let inv;
    if (R.length === 1) inv = [[1 / k[R[0]][R[0]]]];
    else {
      const a = k[2][2], b = k[2][5], c = k[5][2], d = k[5][5], det = a * d - b * c;
      inv = [[d / det, -b / det], [-c / det, a / det]];
    }
    const kc = k.map(r => r.slice()), fc = f.slice();
    for (let i = 0; i < 6; i++) {
      for (let j = 0; j < 6; j++) {
        let s = 0;
        for (let p = 0; p < R.length; p++) for (let q = 0; q < R.length; q++) s += k[i][R[p]] * inv[p][q] * k[R[q]][j];
        kc[i][j] -= s;
      }
      let s = 0;
      for (let p = 0; p < R.length; p++) for (let q = 0; q < R.length; q++) s += k[i][R[p]] * inv[p][q] * f[R[q]];
      fc[i] -= s;
    }
    for (const r of R) { for (let j = 0; j < 6; j++) { kc[r][j] = 0; kc[j][r] = 0; } fc[r] = 0; }
    /* released at both ends, the member is a bar: across its axis it has no stiffness at all. The subtraction
       above leaves a rounding amount there, which would hold up a joint that nothing holds */
    if (R.length === 2) for (const r of [1, 4]) for (let j = 0; j < 6; j++) { kc[r][j] = 0; kc[j][r] = 0; }
    for (let i = 0; i < 6; i++) { for (let j = 0; j < 6; j++) k[i][j] = kc[i][j]; f[i] = fc[i]; }
  }

  /* Gaussian elimination on the diagonally scaled matrix; a vanishing pivot means a mechanism */
  /* The number of independent movements the stiffness does not hold: the size of the matrix less its rank.
     Elimination on the scaled matrix with the largest remaining diagonal entry as pivot (the matrix is symmetric
     and has no negative direction, so its largest entry lies on the diagonal); it ends when no entry above the
     tolerance is left. A direction with no stiffness of its own is one movement. */
  function nullity(A, n, floor, tol) {
    let dm = 0, free = 0;
    for (let i = 0; i < n; i++) dm = Math.max(dm, A[i * n + i]);
    if (!(dm > 0)) return n;
    const keep = [], sc = [];
    for (let i = 0; i < n; i++) { const d = A[i * n + i]; if (d > floor * dm) { keep.push(i); sc.push(1 / Math.sqrt(d)); } else free++; }
    const m = keep.length, B = new Float64Array(m * m);
    for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) B[i * m + j] = A[keep[i] * n + keep[j]] * sc[i] * sc[j];
    let rank = 0;
    for (let k = 0; k < m; k++) {
      let p = k, mx = B[k * m + k];
      for (let i = k + 1; i < m; i++) if (B[i * m + i] > mx) { mx = B[i * m + i]; p = i; }
      if (!(mx > tol)) break;
      if (p !== k) {
        for (let j = 0; j < m; j++) { const t = B[k * m + j]; B[k * m + j] = B[p * m + j]; B[p * m + j] = t; }
        for (let i = 0; i < m; i++) { const t = B[i * m + k]; B[i * m + k] = B[i * m + p]; B[i * m + p] = t; }
      }
      for (let i = k + 1; i < m; i++) { const f = B[i * m + k] / mx; if (f) for (let j = k + 1; j < m; j++) B[i * m + j] -= f * B[k * m + j]; }
      rank++;
    }
    return free + m - rank;
  }

  /* The movements the stiffness does not hold, as vectors: the null space of the matrix. A direction with no stiffness of
     its own is one movement by itself. The rest is found on the scaled matrix by Jacobi rotations (the matrix is small and
     symmetric): the directions whose stiffness is below 10⁻⁹ of the largest one. Returns null when their number is not the
     one that `nullity` counts by elimination: then nothing is said about them. */
  function nullSpace(A, n, floor, tol) {
    let dm = 0;
    for (let i = 0; i < n; i++) dm = Math.max(dm, A[i * n + i]);
    const out = [], keep = [], sc = [];
    for (let i = 0; i < n; i++) { const d = A[i * n + i]; if (dm > 0 && d > floor * dm) { keep.push(i); sc.push(1 / Math.sqrt(d)); } else { const v = new Float64Array(n); v[i] = 1; out.push(v); } }
    const m = keep.length;
    if (m) {
      const B = new Float64Array(m * m), W = new Float64Array(m * m);
      for (let i = 0; i < m; i++) { W[i * m + i] = 1; for (let j = 0; j < m; j++) B[i * m + j] = A[keep[i] * n + keep[j]] * sc[i] * sc[j]; }
      for (let sweep = 0; sweep < 60; sweep++) {
        let off = 0;
        for (let i = 0; i < m; i++) for (let j = i + 1; j < m; j++) off += B[i * m + j] * B[i * m + j];
        if (off < 1e-30) break;
        for (let p = 0; p < m; p++) for (let q = p + 1; q < m; q++) {
          const apq = B[p * m + q];
          if (Math.abs(apq) < 1e-300) continue;
          const th = (B[q * m + q] - B[p * m + p]) / (2 * apq), t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)), c = 1 / Math.sqrt(t * t + 1), sn = t * c;
          for (let k = 0; k < m; k++) { const bkp = B[k * m + p], bkq = B[k * m + q]; B[k * m + p] = c * bkp - sn * bkq; B[k * m + q] = sn * bkp + c * bkq; }
          for (let k = 0; k < m; k++) { const bpk = B[p * m + k], bqk = B[q * m + k]; B[p * m + k] = c * bpk - sn * bqk; B[q * m + k] = sn * bpk + c * bqk; }
          for (let k = 0; k < m; k++) { const wkp = W[k * m + p], wkq = W[k * m + q]; W[k * m + p] = c * wkp - sn * wkq; W[k * m + q] = sn * wkp + c * wkq; }
        }
      }
      let big = 0;
      for (let i = 0; i < m; i++) big = Math.max(big, B[i * m + i]);
      for (let j = 0; j < m; j++) if (B[j * m + j] <= 1e-9 * big) { const v = new Float64Array(n); for (let i = 0; i < m; i++) v[keep[i]] = W[i * m + j] * sc[i]; out.push(v); }
    }
    return out.length === nullity(A, n, floor, tol) ? out : null;
  }

  function gauss(A, b, n, tol, floor) {
    const sc = new Float64Array(n), A0 = A.slice(), b0 = b.slice();
    let dm = 0;
    for (let i = 0; i < n; i++) dm = Math.max(dm, A[i * n + i]);
    /* floor: a direction whose stiffness is a rounding amount beside the largest one is not held (mechanism test) */
    for (let i = 0; i < n; i++) { const d = A[i * n + i]; if (!(d > (floor || 0) * dm)) return null; sc[i] = 1 / Math.sqrt(d); }
    for (let i = 0; i < n; i++) { b[i] *= sc[i]; for (let j = 0; j < n; j++) A[i * n + j] *= sc[i] * sc[j]; }
    for (let k = 0; k < n; k++) {

      const dofs = [3 * m.n1, 3 * m.n1 + 1, 3 * m.n1 + 2, 3 * m.n2, 3 * m.n2 + 1, 3 * m.n2 + 2];
      const kT = k.map(row => T[0].map((_, j) => row.reduce((acc, kv, q) => acc + kv * T[q][j], 0)));
      for (let i = 0; i < 6; i++) {
        let fg = 0;
        for (let p = 0; p < 6; p++) fg += T[p][i] * f0[p];
        F[dofs[i]] -= fg;
        for (let j = 0; j < 6; j++) {
          let kg = 0;
          for (let p = 0; p < 6; p++) kg += T[p][i] * kT[p][j];
          K[dofs[i] * nd + dofs[j]] += kg;
        }
      }
      return { ...g, i: mi, n1: m.n1, n2: m.n2, rel, k, f0, ll, T, dofs, EA: rg && rg[mi] ? Infinity : m.EA, EI: m.EI, W: m.EA / g.L };
    });

    const restrained = new Uint8Array(nd), dummy = new Uint8Array(nd);
    model.nodes.forEach((n, i) => {
      for (const d of RXN[n.sup || 'free']) restrained[3 * i + d] = 1;
      if (!conn[i]) { for (let d = 0; d < 3; d++) { restrained[3 * i + d] = 1; dummy[3 * i + d] = 1; } }
      else if (relc[i] === conn[i] && n.sup !== 'fixed') { restrained[3 * i + 2] = 1; dummy[3 * i + 2] = 1; }
    });
    const hold = opts.hold || [];
    for (const d of hold) restrained[d] = 1;
    const free = [];
    for (let i = 0; i < nd; i++) if (!restrained[i]) free.push(i);
    const nf = free.length, A = new Float64Array(nf * nf), b = new Float64Array(nf);
    for (let i = 0; i < nf; i++) {
      b[i] = F[free[i]];
      for (let j = 0; j < nf; j++) A[i * nf + j] = K[free[i] * nd + free[j]];
    }
    if (opts.modes) return { modes: nullity(A, nf, opts.floor || 0, opts.pivot || 1e-10) };
    if (opts.space) return { space: nullSpace(A, nf, opts.floor || 0, opts.pivot || 1e-10), free };
    const exact = rg && rg.some(Boolean) ? rigidSolve(A, b, nf, free, mem, rg) : null;
    if (rg && rg.some(Boolean) && !exact) return { ok: false, unstable: true, det, noLimit: true };
    const x = exact ? exact.x : nf ? gauss(A, b, nf, opts.pivot || 1e-13, opts.floor) : new Float64Array(0);
    if (!x || det.n + hold.length < 0) return { ok: false, unstable: true, det };
    if (opts.checkOnly) return { ok: true, det };
    const u = new Float64Array(nd);
    free.forEach((d, i) => { u[d] = x[i]; });
    /* the axial force of each rigid member, as it pulls at its two joints */
    const pull = new Float64Array(nd);
    if (exact) for (const [mi, Nv] of exact.N) { const M = mem[mi]; pull[M.dofs[0]] -= M.c * Nv; pull[M.dofs[1]] -= M.s * Nv; pull[M.dofs[3]] += M.c * Nv; pull[M.dofs[4]] += M.s * Nv; }

    const reactions = model.nodes.map((n, i) => {
      const r = [0, 0, 0], has = [false, false, false];
      for (let d = 0; d < 3; d++) {
        const gd = 3 * i + d;
        if (!restrained[gd] || dummy[gd]) continue;
        let s = -F[gd] + pull[gd];
        for (let j = 0; j < nd; j++) s += K[gd * nd + j] * u[j];
        r[d] = s; has[d] = true;
      }
      return { Rx: r[0], Ry: r[1], Mz: r[2], has };
    });

    for (const M of mem) {
      const ug = M.dofs.map(d => u[d]);
      M.ul = M.T.map(row => row.reduce((acc, t, j) => acc + t * ug[j], 0));
      M.f = M.f0.slice();
      for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) M.f[i] += M.k[i][j] * M.ul[j];
      if (exact && exact.N.has(M.i)) { const Nv = exact.N.get(M.i); M.f[0] -= Nv; M.f[3] += Nv; }
    }
    /* What the solution left (err), measured for every structure: the largest force and the largest moment that the end
       forces of the members, as they are returned, leave out of balance at a joint in a direction that no support
       holds; with rigid members also what the equations with their conditions left (rigidSolve), and the largest
       change of length of a rigid member. */
    const out = new Float64Array(nd), jr = { F: 0, M: 0 };
    for (const M of mem) for (let i = 0; i < 6; i++) { let fg = 0; for (let p = 0; p < 6; p++) fg += M.T[p][i] * M.f[p]; out[M.dofs[i]] += fg; }
    for (let d = 0; d < nd; d++) if (!restrained[d]) { const k = d % 3 === 2 ? 'M' : 'F'; jr[k] = Math.max(jr[k], Math.abs(out[d])); }
    const R = { ok: true, u, reactions, mem, det };
    R.err = exact ? { F: Math.max(exact.err.F, jr.F), M: Math.max(exact.err.M, jr.M), u: exact.err.u } : { F: jr.F, M: jr.M, u: 0 };
    if (exact) R.limit = 'exact';
    return lines(R, nSeg);
  }

  /* the lines of every member from its end forces and end displacements, and the largest values of the structure.
     The forces have their largest values at stations (the ends, the load points and the zeros of the shear force are
     stations). A displacement can be largest between two stations: the largest displacement of the structure is the
     largest that its members reach anywhere along them (mostMoved), not the largest at a station. The coarse lines of
     the steps towards the rigid limit (nSeg below 160) are not searched: only their end values are used. */
  function lines(R, nSeg = 160) {
    /* turn: the largest rotation of a member anywhere along it (turnOf), in radians, turnM: that member;
       strain: the largest strain along the axis of a member, |N| / EA, anywhere in it (strainOf), strainM: that member,
       strainAt: the stretch of the member that has it [from, to], strainSign: +1 stretched, -1 shortened */
    const max = { N: 0, V: 0, M: 0, D: 0, turn: 0, turnM: -1, strain: 0, strainM: -1, strainAt: null, strainSign: 0 };
    /* The largest force of the structure: a reaction, or N or V of a member. Between two point loads the distributed load
       acts one way, so N and V are largest at an end of the member or beside a point load. From it: the force that the
       analysis cannot tell from zero, nilF = 1e-9 kN + a hundred times the uncertainty it states for a force + 1e-10 of
       that largest force (the last digits of the elimination). The page calls N and V zero below it, and a zero of the
       shear is looked for with it (vZeros).
       The same for a moment, with the largest force times the longest member as its scale.
       For a displacement, nilD = 1e-12 m + a hundred times the stated change of length of a rigid member + what the
       last digit of a load direction can bend: a load along a member that is not along an axis of the sheet has a
       part across the member of 1e-16 of its size by the arithmetic of its direction alone; nilD takes a thousand
       times that, 1e-13 of the largest force, on the longest member as a cantilever of the smallest bending
       stiffness, F L^3 / (3 EI); and 1e-10 of the largest displacement, for the last digits of the integration along
       the members. Up to review 09 the term of the load was 1e-10 of that deflection, and 95 loads of 1000 kN along a
       beam of 30 m hid a deflection of 0.02 mm (finding C102): with 1e-13 the amount is 2e-5 mm there. */
    let fm = 0;
    for (const r of R.reactions) fm = Math.max(fm, Math.abs(r.Rx), Math.abs(r.Ry));
    for (const M of R.mem) {   /* the member runs from just behind its start to just before its end: a load on an end joint is not inside it */
      const at = [[0, 1], [M.L, -1]];
      for (const q of M.ll.pts) if (q.a > 1e-9 && q.a < M.L - 1e-9) at.push([q.a, -1], [q.a, 1]);
      for (const [x, sd] of at) { const f = forcesAt(M, x, sd); fm = Math.max(fm, Math.abs(f.N), Math.abs(f.V)); }
    }
    R.fmax = fm; R.nilF = 1e-9 + 100 * (R.err ? R.err.F : 0) + 1e-10 * fm;
    { let Lx = 0, EIn = Infinity; for (const M of R.mem) { Lx = Math.max(Lx, M.L); EIn = Math.min(EIn, M.EI); }
      R.nilM = 1e-9 + 100 * (R.err ? R.err.M : 0) + 1e-10 * fm * Lx;
      R.nilD = 1e-12 + 100 * (R.err ? R.err.u : 0) + 1e-13 * fm * Lx * Lx * Lx / (3 * EIn); }   /* the last digits of the largest displacement itself are added below, when it is known */
    for (const M of R.mem) M.nilF = R.nilF;
    for (const M of R.mem) {
      M.smp = sample(M, nSeg); M._top = M._wt = null;
      const S = M.smp;
      for (let i = 0; i < S.xs.length; i++) {
        max.N = Math.max(max.N, Math.abs(S.N[i]));
        max.V = Math.max(max.V, Math.abs(S.V[i]));
        max.M = Math.max(max.M, Math.abs(S.M[i]));
        max.D = Math.max(max.D, Math.hypot(S.dX[i], S.dY[i]));
      }
      if (nSeg >= 160) {
        max.D = Math.max(max.D, mostMoved(M).v);
        const q = turnOf(M), e = strainOf(M);
        if (q > max.turn) { max.turn = q; max.turnM = M.i; }
        if (e.e > max.strain) { max.strain = e.e; max.strainM = M.i; max.strainAt = [e.x0, e.x1]; max.strainSign = e.sign; }
      }
    }
    R.max = max;
    R.nilD += 1e-10 * max.D;   /* the last digits of the integration along the members: of no weight in the question whether anything moves */
    return R;
  }

  /* value of a sampled quantity at local x; side picks the jump side. N, V and M of the samples are joined by straight
     lines (the page reads its numbers from forcesAt, which is exact). A displacement or a slope is integrated from the
     sample before x where the series still belongs to its member; a mixed series (the moving picture between two states)
     follows the parabola through three samples */
  function interp(S, key, x, side) {
    const xs = S.xs, a = S[key], n = xs.length;
    if (x <= xs[0]) return a[0];
    if (x >= xs[n - 1]) return a[n - 1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (xs[mid] < x || (xs[mid] === x && side > 0)) lo = mid; else hi = mid;
    }
    const x0 = xs[lo], x1 = xs[hi];
    if (x1 <= x0) return side > 0 ? a[hi] : a[lo];
    if (S.fine && (key === 'dX' || key === 'dY' || key === 'rot')) return S.fine(x)[key];
    const lin = a[lo] + (a[hi] - a[lo]) * (x - x0) / (x1 - x0);
    if (key !== 'dX' && key !== 'dY') return lin;
    /* a displacement is a smooth line: between two samples it follows the parabola through them and the next sample
       on the nearer side, so that a value read between the samples is right to the printed digit */
    const pick = dir => { let k = dir < 0 ? lo - 1 : hi + 1; while (k >= 0 && k < n && (xs[k] === x0 || xs[k] === x1)) k += dir; return k >= 0 && k < n ? k : -1; };
    let k = pick(x - x0 < x1 - x ? -1 : 1);
    if (k < 0) k = pick(x - x0 < x1 - x ? 1 : -1);
    if (k < 0) return lin;
    const x2 = xs[k];
    return a[lo] * (x - x1) * (x - x2) / ((x0 - x1) * (x0 - x2)) + a[hi] * (x - x0) * (x - x2) / ((x1 - x0) * (x1 - x2)) + a[k] * (x - x0) * (x - x1) / ((x2 - x0) * (x2 - x1));
  }

  /* One analysis as the page shows it. A mechanism is detected on the well-conditioned system with the real
     axial stiffness; the results are then computed with frame members axially rigid (the assumption of hand
     methods), while bars hinged at both ends keep their real axial stiffness. */
  /* What a mechanism lacks: every joint is held in turn sideways (d = 0) and vertically (d = 1); listed are the
     single holds that make the structure stable. Empty when one hold is not enough. */
  function loose(model) {
    const out = [];
    model.nodes.forEach((n, i) => {
      const has = RXN[n.sup || 'free'];
      for (const d of [0, 1]) if (!has.includes(d) && solve(model, { checkOnly: true, pivot: 1e-10, floor: 1e-10, hold: [3 * i + d] }).ok) out.push({ i, d });
    });
    return out;
  }

  /* Which members are bars. An end of a member carries no moment when it is released by a hinge, or when nothing at
     its joint can take a moment from it: no fixed support there and no other member attached without a hinge. A member
     with two such ends is a bar and keeps its real axial stiffness: a truss bar, a strut hinged at both joints, a
     column on a pin with a hinge at its head. In a beam (all members in one line) no member is singled out: its axial
     stiffness is the same along its whole length. */
  function bars(model) {
    const rel = model.members.map(m => endReleases(model, m));
    const none = (mi, k) => {
      if (rel[mi][k]) return true;
      const m = model.members[mi], ni = k ? m.n2 : m.n1;
      if ((model.nodes[ni].sup || 'free') === 'fixed') return false;
      return !model.members.some((q, j) => j !== mi && ((q.n1 === ni && !rel[j][0]) || (q.n2 === ni && !rel[j][1])));
    };
    const a = model.nodes[model.members[0].n1], b = model.nodes[model.members[0].n2], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (model.nodes.every(n => Math.abs((n.x - a.x) * dy - (n.y - a.y) * dx) <= 1e-9 * d2)) return model.members.map(() => false);
    return model.members.map((m, mi) => none(mi, 0) && none(mi, 1));
  }

  /* One analysis as the page shows it. Whether the structure is a mechanism is tested with the real axial stiffness
     of every member. The results are those of members that are rigid along their axis, the assumption of hand
     methods; bars keep their real axial stiffness. The rigid members are solved exactly, with their length as a
     condition (rigidSolve): the result does not depend on a factor, and it holds for any lengths and profiles.
     The analysis says what its arithmetic left (err): the largest force and the largest moment out of balance in its
     equations, and the largest change of length of a rigid member (m). These are the last digits of the elimination,
     not a bound. The page calls a line zero only below a hundred times that amount plus the last digits of the
     arithmetic, and only when the line prints 0.0 (app.js, targets). The last digits are those of the largest value of
     its kind in the structure, not of the value itself: with a member of 18 m a shear that is zero by hand can come
     out as 1e-11 kN beside a largest force of 600 kN. The page allows 1e-10 of the largest value for them.
     Should the reduced stiffness of the exact way not be solved (it never happened in the tests), the limit is taken as
     before: from three solutions with the axial stiffness of the rigid members 10, 10² and 10³ times the real one
     (stepsLimit); the result then says so (limit: 'steps'). */
  /* EI and EA are those of the section of the structure. A member with a section of its own carries two factors on
     them: kf on EI and ka on EA (the page sets both from the two sections; 1 where the member has the section of the
     structure). */
  function analyse(model, EI, EA, rigid = 10) {
    const bar = bars(model);
    model.members.forEach(m => { m.EI = EI * (m.kf || 1); m.EA = EA * (m.ka || 1); });
    const chk = solve(model, { checkOnly: true, pivot: 1e-10, floor: 1e-10 });
    if (!chk.ok) { chk.loose = loose(model); chk.modes = solve(model, { modes: true, pivot: 1e-10, floor: 1e-10 }).modes; return chk; }
    if (!bar.includes(false)) { const R = solve(model); R.bar = bar; return R; }   /* every member a bar: nothing is taken as rigid; what the solution left is measured like everywhere (solve) */
    const R = solve(model, { rigid: bar.map(q => !q) });
    if (!R.ok) return stepsLimit(model, EA, bar, rigid);
    model.members.forEach((m, i) => { m.EA = bar[i] ? EA * (m.ka || 1) : Infinity; });
    R.bar = bar;
    return R;
  }
  /* The rigid limit in three steps, kept for the case that the exact way fails: the structure is solved with the axial
     stiffness of its rigid members 10, 10² and 10³ times the real one. What a finite factor f leaves in the results
     falls as a/f + b/f², and the three solutions s1, s2, s3 remove both parts: the limit is (1000 s3 - 110 s2 + s1) / 891.
     This holds while the stiffened axial stiffness is large beside the bending stiffness of the shortest members: for
     a column of 0.5 m under a beam of 30 m it is not, and the limit is then off in the fourth digit. err is here the
     difference of the two limits of the first order, (10 s2 - s1) / 9 and (10 s3 - s2) / 9. */
  function stepsLimit(model, EA, bar, rigid) {
    const run = f => { model.members.forEach((m, i) => { m.EA = EA * (m.ka || 1) * (bar[i] ? 1 : f); }); return solve(model, { nSeg: 2 }); };
    const s1 = run(rigid), s2 = run(10 * rigid), s3 = run(100 * rigid);
    for (const q of [s1, s2, s3]) if (!q.ok) return q;
    const lim = (p, q, r) => (1000 * r - 110 * q + p) / 891, gap = (p, q, r) => Math.abs(10 * r - 11 * q + p) / 9, err = { F: 0, M: 0, u: 0 };
    for (let i = 0; i < s3.u.length; i++) { if (i % 3 < 2) err.u = Math.max(err.u, gap(s1.u[i], s2.u[i], s3.u[i])); s3.u[i] = lim(s1.u[i], s2.u[i], s3.u[i]); }
    s3.reactions.forEach((r, i) => { for (const k of ['Rx', 'Ry', 'Mz']) { const e = k === 'Mz' ? 'M' : 'F'; err[e] = Math.max(err[e], gap(s1.reactions[i][k], s2.reactions[i][k], r[k])); r[k] = lim(s1.reactions[i][k], s2.reactions[i][k], r[k]); } });
    s3.mem.forEach((M, i) => {
      const P = s1.mem[i], Q = s2.mem[i];
      for (let k = 0; k < 6; k++) {
        if (k % 3 < 2) err.u = Math.max(err.u, gap(P.ul[k], Q.ul[k], M.ul[k]));
        const e = k % 3 === 2 ? 'M' : 'F'; err[e] = Math.max(err[e], gap(P.f[k], Q.f[k], M.f[k]));
        M.ul[k] = lim(P.ul[k], Q.ul[k], M.ul[k]); M.f[k] = lim(P.f[k], Q.f[k], M.f[k]);
      }
      /* a rigid member does not change its length: its axial strain is zero in the limit. EAr keeps the stiffness of the
         last and stiffest step, from which the page tells what a finite factor would have left */
      if (!bar[i]) { M.EAr = EA * (model.members[i].ka || 1) * 100 * rigid; M.EA = Infinity; }
    });
    model.members.forEach((m, i) => { m.EA = bar[i] ? EA * (m.ka || 1) : Infinity; });
    s3.bar = bar; s3.err = err; s3.limit = 'steps';
    return lines(s3);
  }

  /* Where a member moves most, and how far: { x, v, inner, dX, dY }, kept with the member.
     Along the member the movement is u, across it w: u′ = N/EA, w′ = the slope, w″ = M/EI. The square of its size is
     f = u² + w². The stations of the member hold both sides of every point load and the zeros of N, V and M
     (shapePlaces): between two neighbouring stations N, V and M keep their signs, so u, the slope and M each run one way.
     A member that is rigid along its axis has the same u everywhere. It moves most where |w| is largest: at a station,
     or where the slope is zero. Between two stations the slope is zero once at most; the place is found by halving.
     A bar without a load of its own moves in a straight line between its joints: f is a parabola that opens upward and
     is largest at a joint.
     A bar with loads: a stretch between two stations is cut where the slope is zero, so that w runs one way on each
     piece as well. Half the second derivative of f, f″/2 = u′² + u·u″ + w′² + w·w″, then lies between two numbers that follow from
     the values at the two ends of the piece (u, u′, w, w′ and M run one way, N′ is a straight line). Not below zero:
     f has no top inside the piece. Not above zero: f′ falls and is zero once at most, found by halving. Otherwise the
     piece is halved and both halves are looked at again, down to a billionth of the member.
     So no top is passed over, and the largest of the tops and of the stations is taken. */
  function mostMoved(M) {
    if (M._top) return M._top;
    return (M._top = topFrom(M, 0, 0));
  }
  /* The same search for the movement against a point that moves by (X0, Y0): the largest distance between the
     displacement of a point of the member and that displacement. The derivatives of the movement are the same, so
     the search is the same with the movement counted from (X0, Y0). */
  function topFrom(M, X0, Y0) {
    const S = M.smp, xs = S.xs, n = xs.length, L = M.L, c = M.c, s = M.s, bar = isFinite(M.EA), du = S.du || 0;
    let best = [xs[0], Math.hypot(S.dX[0] - X0, S.dY[0] - Y0)];
    const take = (x, v) => { if (v > best[1]) best = [x, v]; };
    for (let i = 1; i < n; i++) take(xs[i], Math.hypot(S.dX[i] - X0, S.dY[i] - Y0));
    const at = x => S.fine(Math.min(L, Math.max(0, x))), size = x => { const q = at(x); return Math.hypot(q.dX - X0, q.dY - Y0); };
    const zero = (fn, lo, hi, flo) => { for (let k = 0; k < 60; k++) { const xm = (lo + hi) / 2; if (fn(xm) * flo > 0) lo = xm; else hi = xm; } return (lo + hi) / 2; };
    const own = bar && (M.ll.pts.length > 0 || [M.ll.q1x, M.ll.q1y, M.ll.q1x + M.ll.tx * L, M.ll.q1y + M.ll.ty * L].some(v => Math.abs(v) > 1e-12));
    /* a point of a bar with all that the bend of f needs; side picks the side of a point load */
    const P = (x, sd) => { const q = at(x), f = forcesAt(M, x, sd), ax = q.dX - X0, ay = q.dY - Y0; return { x, u: ax * c + ay * s, w: -ax * s + ay * c, r: q.rot, e: f.N / M.EA + du, N: f.N, k: f.M / M.EI }; };
    const sq = (a, b) => (a * b <= 0 ? [0, Math.max(a * a, b * b)] : [Math.min(a * a, b * b), Math.max(a * a, b * b)]);
    const pr = (a1, a2, b1, b2) => { const v = [a1 * b1, a1 * b2, a2 * b1, a2 * b2]; return [Math.min(...v), Math.max(...v)]; };
    const g = q => q.u * q.e + q.w * q.r;
    const piece = (A, B, depth) => {
      const h = B.x - A.x;
      if (!(h > 1e-9 * L)) return;
      const m = P((A.x + B.x) / 2, -1), nA = (-3 * A.N + 4 * m.N - B.N) / h / M.EA, nB = (A.N - 4 * m.N + 3 * B.N) / h / M.EA;
      const t1 = sq(A.e, B.e), t2 = pr(A.u, B.u, nA, nB), t3 = sq(A.r, B.r), t4 = pr(A.w, B.w, A.k, B.k), lo = t1[0] + t2[0] + t3[0] + t4[0], hi = t1[1] + t2[1] + t3[1] + t4[1];
      if (lo >= 0) return;

  const deg = nodes.map(() => 0);
  const members = p.members.map(([n1, n2, o = {}]) => {
    deg[n1]++; deg[n2]++;
    const vertical = Math.abs(nodes[n1].x - nodes[n2].x) < 1e-9;
    const pair = Array.isArray(o.w) ? o.w : [o.w || 0, o.w || 0], on = pair[0] > 0 || pair[1] > 0, def = p.wref || 10;
    return { n1, n2, sec: null, kf: 1, ka: 1, rel: [0, 0], udl: { on, w1: on ? pair[0] : def, w2: on ? pair[1] : def, ang: o.ang === undefined ? (vertical ? 0 : -90) : o.ang } };
  });
  let id = 1;
  const loads = (p.loads || []).map(([m, a, P, ang]) => ({ id: id++, m, a, P, ang: ang === undefined ? -90 : ang }));
  /* node roles: supports and free ends cycle through support types; inner joints toggle a hinge */
  const ymin = Math.min(...nodes.map(n => n.y));
  nodes.forEach((n, i) => { n.cs = n.sup !== 'free' || deg[i] === 1; n.ch = !n.cs && deg[i] >= 2 && !p.truss; });
  const order = nodes.map((n, i) => i).sort((a, b) =>
    (nodes[a].y > ymin + 1e-9) - (nodes[b].y > ymin + 1e-9) || nodes[a].x - nodes[b].x || nodes[a].y - nodes[b].y);
  const letters = 'ABCDEFHJKLMNPQRSTUVW';

  const nh = nodes.filter(n => n.hinge && n.sup === 'free').length;
  for (const i of order) {
    const n = nodes[i];
    if (p.truss) n.lbl = n.sup !== 'free' ? letters[k++] : '';
    else if (n.hinge && n.sup === 'free') n.lbl = nh > 1 ? 'G' + (++g) : 'G';
    else n.lbl = letters[k++];
  }
  return { nodes, members, loads, nid: id, pref: p.pref || 20, wref: p.wref || 10, truss: !!p.truss, cut: p.cut || null };
}

/* ---------- lengths ---------- */
/* The joints stand on a grid: their places along x and along y, kept in centimetres (rounded half away from zero, with
   the same allowance for the binary arithmetic as every typed value of the page). */
const cm = v => { const t = Math.abs(v) * 100, r = Math.floor(t + 0.5 + Math.max(1e-9, 4e-13 * t)) / 100; return v < 0 ? -r : r; };

   of the grid, and none for a member that spans more than one step */
function lenAxisOf(m, mi) {
  const k = m.members[mi], a = m.nodes[k.n1], b = m.nodes[k.n2], ax = Math.abs(a.y - b.y) < 1e-9 ? 'x' : Math.abs(a.x - b.x) < 1e-9 ? 'y' : null;
  if (!ax) return null;
  const lo = Math.min(a[ax], b[ax]), hi = Math.max(a[ax], b[ax]);
  return m.nodes.some(n => n[ax] > lo + 1e-9 && n[ax] < hi - 1e-9) ? null : ax;
}
/* One step of the grid, from v0 to v1, gets the length len: every joint at v1 or beyond moves along by the difference.
   A member whose length changes keeps its point loads at their share of the length: a load on a joint stays on that
   joint, a load inside stays inside, and its place is kept in centimetres like a typed one. */
function stretch(m, ax, v0, v1, len) {
  const L0 = m.members.map((k, i) => memLen(m, i)), d = len - (v1 - v0);
  for (const n of m.nodes) if (n[ax] > v1 - 1e-9) n[ax] = cm(n[ax] + d);
  m.members.forEach((k, i) => {
    /* a member that only moved along can come out a last digit longer or shorter: a load on its end joint is set on
       the length as it now stands, a load inside keeps its place */
    const L1 = memLen(m, i), same = Math.abs(L1 - L0[i]) < 1e-9;

  });

/* a model kept from an earlier version of the page: one value per distributed load */
function normModel(m) {
  for (const mb of m.members) { const u = mb.udl; if (u && u.w1 === undefined) { u.w1 = u.w2 = u.w || m.wref || 10; delete u.w; } }
  return m;
}

        row(`|${V('M', 'corner')}| = ${fr(`${P}${D}${h_}${D}3${k_}`, `2${D}(6${k_} + 1)`)}`, sub(() => `${X1(Pv)} ${D} ${X2(h)} ${D} 3 ${D} ${XK(k)} / (2 ${D} (6 ${D} ${XK(k)} + 1))`), Pv * h * 3 * k / (2 * (6 * k + 1)), 'kNm', Math.abs(Mc)),
      ] }];
    }

  }

  function threeHinge(model, sol, G) {
    const sup = model.nodes.map((n, i) => ({ n, i })).filter(o => o.n.sup !== 'free');
    if (sup.length !== 2 || sup.some(o => o.n.sup !== 'pin') || Math.abs(sup[0].n.y - sup[1].n.y) > E9) return null;
    const hg = model.nodes.filter(n => n.hinge && n.sup === 'free');
    if (hg.length !== 1 || model.nodes.some(n => n.hinge && n.sup !== 'free') || model.members.some(m => m.rel[0] || m.rel[1])) return null;
    if (sol.det.n !== 0 || !G.vertical || (!G.pts.length && !G.udl.length)) return null;
    sup.sort((p, q) => p.n.x - q.n.x);
    const [A, B] = sup, g = hg[0], l = B.n.x - A.n.x, f = g.y - A.n.y, xg = g.x - A.n.x;
    if (f < 1e-6 || xg < 1e-6 || xg > l - 1e-6) return null;
    const ld = G.pts.map(p => ({ F: -p.Fy, x: p.x - A.n.x })).concat(G.udl.map(u => ({ F: -u.Fy, x: u.xc - A.n.x })));
    let sF = 0, sM = 0, left = 0;
    for (const t of ld) { sF += t.F; sM += t.F * t.x; if (t.x < xg - E9) left += t.F * (xg - t.x); }
    const Av = sF - sM / l, M0 = Av * xg - left, H = M0 / f;
    const ws = G.udl.length ? -G.udl[0].wy : 0, w = Math.abs(ws), ps = ws < 0 ? MN : '';
    const cover = G.udl.reduce((s, u) => s + (u.x2 - u.x1), 0);
    const std = !G.pts.length && !G.tri && G.udl.every(u => Math.abs(-u.wy - ws) < E9) && Math.abs(cover - l) < E9 && Math.abs(xg - l / 2) < E9;
    const M0_ = V('M', '0,' + g.lbl), lA = A.n.lbl, fx = RX(lA);
    const rows = std ? [
      row(`${M0_} = ${ps}${fr(w_ + D + p2(l_), '8')}`, sub(() => `${ps}${X1(w)} ${D} ${X2(l)}² / 8`), M0, 'kNm'),
      row(`${fx} = ${fr(M0_, f_)} = ${ps}${fr(w_ + D + p2(l_), '8' + D + f_)}`, sub(() => `${ps}${X1(w)} ${D} ${X2(l)}² / (8 ${D} ${X2(f)})`), H, 'kN', sol.reactions[A.i].Rx),
    ] : [
      row(`${M0_} = ${RZ(lA)}${D}${V('x', g.lbl)} ${MN} Σ ${P}${D}${V('e')}`, null, M0, 'kNm'),

    }

    return [{ title: 'Three-hinged frame', dim: [vd(A.n.y, g.y, 'f')], rows, note: std
      ? `${M0_} = moment at ${g.lbl} of a simple beam with the same span and load; l = distance ${lA} to ${B.n.lbl}, ${tail}` + (ws < 0 ? ` The load acts upward: ${w_} is its size, and the forces, moments and deflections have the opposite sign.` : '')
      : `${M0_} = moment at ${g.lbl} of a simple beam with the same loads: ${RZ(lA)} times its distance ${V('x', g.lbl)} to ${g.lbl}, minus every load left of ${g.lbl} times its distance e to ${g.lbl}; ${tail}` + upNote(G) + (G.tri ? resNote(G) : '') }];
  }

  /* one fixed support, no other support: reactions straight from the loads */
  function treeCard(model, sol, G) {
    const sup = model.nodes.map((n, i) => ({ n, i })).filter(o => o.n.sup !== 'free');
    if (sup.length !== 1 || sup[0].n.sup !== 'fixed' || sol.det.n !== 0) return null;
    const A = sup[0], lA = A.n.lbl, R = sol.reactions[A.i], tm = [];
    let sx = 0, sy = 0, sm = 0;
    const add = (Fx, Fy, x, y, txt, mag) => { const m = -((x - A.n.x) * Fy - (y - A.n.y) * Fx); sx += Fx; sy += Fy; sm += m; tm.push({ txt, e: m / mag }); };
    for (const p of G.pts) add(p.Fx, p.Fy, p.x, p.y, () => X1(p.P), p.P);
    for (const u of G.udl) add(u.Fx, u.Fy, u.xc, u.yc, () => res(u), u.W);
    if (!tm.length) return null;
    const rows = [];
    if (Math.abs(sy) > E9) rows.push(row(`${RZ(lA)} = Σ ${V('P', 'z')}`, null, -sy, 'kN', R.Ry));
    if (Math.abs(sx) > E9) rows.push(row(`${RX(lA)} = ${MN}Σ ${V('P', 'x')}`, null, -sx, 'kN', R.Rx));
    const MR = V('M', lA + 'y');
    rows.push(row(`${MR} = Σ ${P}${D}${V('e')}`, tm.length <= 3 ? sub(() => tm.map((t, i) => (t.e < 0 ? (i ? ` ${MN} ` : MN) : (i ? ' + ' : '')) + `${t.txt()} ${D} ${X2(Math.abs(t.e))}`).join('')) : null, sm, 'kNm', R.Mz));
    return [{ title: 'Cantilever frame, statics', note: `${V('P', 'x')} and ${V('P', 'z')} are the parts of a load to the right and downward, e its lever arm about ${lA}. ${MR} is the fixing moment of the support about the y axis, the curved arrow at ${lA}; it counts positive counter-clockwise. The moment line starts at ${lA} with the same size.` + (G.tri ? resNote(G) : ''), rows }];
  }

  /* The cut of the method of sections, from the three bars it goes through (model.cut: top, diag, bot) and the places of
     their joints as they are now: xa to xb the panel, h the distance of the chords, xT the joint of the bottom chord
     where the diagonal ends (the moments about it give the top chord), xB that of the top chord (for the bottom chord).
     None where the panel is no longer two level chords with one diagonal between them. */
  function cutOf(model) {
    const q = model.cut;
    if (!q) return null;
    const N = i => model.nodes[i], t = model.members[q.top], d = model.members[q.diag], b = model.members[q.bot];
    if (!t || !d || !b || Math.abs(N(t.n1).y - N(t.n2).y) > E9 || Math.abs(N(b.n1).y - N(b.n2).y) > E9) return null;
    const onT = [d.n1, d.n2].find(i => i === t.n1 || i === t.n2), onB = [d.n1, d.n2].find(i => i === b.n1 || i === b.n2);
    if (onT === undefined || onB === undefined || onT === onB) return null;
    const xa = Math.min(N(b.n1).x, N(b.n2).x), xb = Math.max(N(b.n1).x, N(b.n2).x), h = N(t.n1).y - N(b.n1).y;
    if (h < E9 || Math.abs(Math.min(N(t.n1).x, N(t.n2).x) - xa) > E9 || Math.abs(Math.max(N(t.n1).x, N(t.n2).x) - xb) > E9) return null;
    if (Math.abs(N(onT).x - xa) > E9 || Math.abs(N(onB).x - xb) > E9) return null;   /* the diagonal falls to the right: the sign of its formula */
    return { top: q.top, diag: q.diag, bot: q.bot, xa, xb, h, xT: N(onB).x, xB: N(onT).x };
  }
  function trussCard(model, sol, G) {
    const c = cutOf(model);

    if (G.pts.some(p => p.a > 1e-6 && p.a < p.L - 1e-6)) return null;
    const sup = model.nodes.map((n, i) => ({ n, i })).filter(o => o.n.sup !== 'free');
    if (sup.length !== 2 || sup.map(o => o.n.sup).sort().join() !== 'pin,roller') return null;   /* no horizontal thrust */
    sup.sort((p, q) => p.n.x - q.n.x);
    const xA = sup[0].n.x, l = sup[1].n.x - xA, ld = G.pts.map(p => ({ F: -p.Fy, x: p.x }));
    const Av = ld.reduce((s, t) => s + t.F * (sup[1].n.x - t.x), 0) / l;
    const M0 = x => Av * (x - xA) - ld.reduce((s, t) => s + (t.x < x - E9 ? t.F * (x - t.x) : 0), 0);
    const V0 = Av - ld.reduce((s, t) => s + (t.x <= c.xa + E9 ? t.F : 0), 0);

    return [{ title: 'Method of sections', cut: c, dim: [vd(sup[0].n.y, sup[0].n.y + c.h, 'h')], note: `Cut through the marked panel. ${M0_} and ${V0_}: moment and shear of a simple beam with the same loads; left and right are the two ends of the panel, α is the slope of the diagonal. Each chord force follows from moments about the joint where the other two cut bars meet.`, rows: [
      row(`${V('N', 'top')} = ${MN}${fr(Mt, h_)}`, sub(() => `${MN}${par(M0(c.xT))} / ${X2(c.h)}`), -M0(c.xT) / c.h, 'kN', N(c.top)),
      row(`${V('N', 'bottom')} = ${fr(Mb, h_)}`, sub(() => `${X1(M0(c.xB))} / ${X2(c.h)}`), M0(c.xB) / c.h, 'kN', N(c.bot)),

  }

  function hand(model, sol) {
    if (!sol || !sol.ok) return [];
    const G = gather(model);
    const cards = beamCards(model, sol, G) || portalCard(model, sol, G) || threeHinge(model, sol, G) || treeCard(model, sol, G) || trussCard(model, sol, G) || [];
    const c0 = cards.find(c => c.rows.some(r => r.f.includes('<i>F</i>')));
    if (c0) c0.note = `${V('F')} = support reaction, the orange arrow.` + (c0.note ? ' ' + c0.note : '');
    return cards;
  }

  /* how the moment line of one member is built from its end moments and its own load */
  function insight(sol, mi) {
    const M = sol.mem[mi], L = M.L, F = x => S.forcesAt(M, x, x <= 0 ? 1 : -1);
    const M1 = F(0).M, M2 = F(L).M, q1 = -M.ll.q1y, q2 = -M.ll.q2y, a1 = Math.abs(q1), a2 = Math.abs(q2);

    const m1 = V('M', '1'), m2 = V('M', '2'), m0 = V('M', '0'), qa_ = V('q', '1'), qb_ = V('q', '2');
    if (!pts.length && !hasQ) {
      const Vc = F(L / 2).V;
      const along = Math.abs(M.ll.q1x) > E9 || Math.abs(M.ll.q2x) > E9 || M.ll.pts.some(p => Math.abs(p.px) > E9 && p.a > E9 && p.a < L - E9);
      return { kind: 'none', text: along ? 'No load across the member: V constant, M a straight line. The load along the member changes N only.' : 'No load on the member: V constant, M a straight line.', M1, M2, rows: [
        row(`${m2} = ${m1} + ${V('V')}${D}${L_}`, null, M1 + Vc * L, 'kNm', M2)] };
    }

      const s0 = () => (uni ? `${X1(a1)} ${D} ${X2(L)}² / 8` : tri ? `${X1(Math.max(a1, a2))} ${D} ${X2(L)}² / 16` : `(${X1(a1)} + ${X1(a2)}) ${D} ${X2(L)}² / 16`);
      const text = (uni ? 'Uniform load: a parabola hung from the end moments.' : `${tri ? 'Triangular load' : 'Load that runs from one value to another'}: a cubic curve hung from the end moments.`)
        + ` ${m0} is the midspan moment of a simple beam with this load.` + (up ? ` It is negative: the load acts ${Math.abs(M.s) < E9 ? 'upward' : 'away from the dashed side'}.` : '');

        row(`${m0} = ${lead}${f0}`, sub(() => lead + s0()), m0s, 'kNm'),
        row(`${V('M', 'mid')} = ${fr(`${m1} + ${m2}`, '2')} + ${m0}`, sub(() => `(${X1(M1)} ${plus(M2)}) / 2 ${plus(m0s)}`), (M1 + M2) / 2 + m0s, 'kNm', F(L / 2).M)] };

        row(`${m0} = ${Pz < 0 ? MN : ''}${fr(P + D + a_ + D + b_, L_)}`, sub(() => `${Pz < 0 ? MN : ''}${X1(Math.abs(Pz))} ${D} ${X2(a)} ${D} ${X2(b)} / ${X2(L)}`), Pz * a * b / L, 'kNm'),
        row(`${V('M', 'P')} = ${m1} + (${m2} ${MN} ${m1})${D}${fr(a_, L_)} + ${m0}`, null, M1 + (M2 - M1) * a / L + Pz * a * b / L, 'kNm', F(a).M)] };

  /* how the shear line of one member follows from its loads, and its moment line from the shear */
  function shear(model, sol, mi) {
    const M = sol.mem[mi], L = M.L, F = x => S.forcesAt(M, x, x <= 0 ? 1 : -1);
    const V1 = F(0).V, V2 = F(L).V, M1 = F(0).M, M2 = F(L).M, q1 = -M.ll.q1y, q2 = -M.ll.q2y, qm = (q1 + q2) / 2, a1 = Math.abs(q1), a2 = Math.abs(q2), qh = Math.max(a1, a2);
    const pts = M.ll.pts.filter(p => Math.abs(p.py) > E9 && p.a > E9 && p.a < L - E9), hasQ = a1 > E9 || a2 > E9, uni = Math.abs(q1 - q2) < E9, tri = !uni && (a1 < E9 || a2 < E9), sP = pts.reduce((t, p) => t - p.py, 0);
    const v1 = V('V', '1'), v2 = V('V', '2'), m1 = V('M', '1'), m2 = V('M', '2'), qa_ = V('q', '1'), qb_ = V('q', '2'), x0_ = V('x', '0'), sg = t => (t < 0 ? '+' : MN), rows = [];
    let text, x0 = 0, ab = false, turn = null;

    const turnAt = xr => ({ V: S.forcesAt(M, xr / 2, -1).V, M: F(xr).M });
    if (!pts.length && !hasQ) {
      text = 'No load across the member: V is constant. It is the slope of the moment line.';
      rows.push(row(`${V('V')} = ${fr(`${m2} ${MN} ${m1}`, L_)}`, sub(() => `(${X1(M2)} ${minus(M1)}) / ${X2(L)}`), (M2 - M1) / L, 'kN', F(L / 2).V));
    } else {
      const many = pts.length > 1, way = qm < 0 ? 'rises' : 'falls', area = ' The moment changes by the area under V';
      text = !pts.length ? (uni ? `Uniform load: V ${way} by q on every metre, a straight line.${area}.`
        : `${tri ? 'Triangular load' : 'Load that runs from one value to another'}: on every metre V ${way} by the load there. The line is a parabola, ${tri ? 'flat where the load is zero' : 'steepest where the load is highest'}.${area}.`)
        : hasQ ? `V ${way} by ${uni ? 'q' : 'the load'} on every metre and steps by P at a point load.${area}.`
          : many ? `Point loads: V steps by P at each load and is constant between them.${area}.` : `Point load: V steps by P at the load and is constant on both sides.${area}: one rectangle on each side.`;

      /* loads at one place act together: the step there is their sum, and none where they cancel (review 11, C114) */
      if (pts.some((p, i) => pts.some((r, j) => j > i && Math.abs(p.a - r.a) < E9))) text += ' Loads at one place count together: V steps by their sum there, and not at all where they cancel.';
      /* the whole distributed load on the member: q·L, q·L/2 for a triangle, the mean value times L otherwise */
      const qF = uni ? `${w_}${D}${L_}` : tri ? fr(w_ + D + L_, '2') : `${fr(`${qa_} + ${qb_}`, '2')}${D}${L_}`;
      const qS = () => (uni ? `${X1(a1)} ${D} ${X2(L)}` : tri ? `${X1(qh)} ${D} ${X2(L)} / 2` : `(${X1(a1)} + ${X1(a2)}) / 2 ${D} ${X2(L)}`);
      /* point loads that act both ways: P is a size, so each load enters with the sign of its direction */
      const mixed = pts.some(p => p.py > E9) && pts.some(p => p.py < -E9), ord = pts.slice().sort((x, y) => x.a - y.a), few = ord.length <= 4;
      const pF = !pts.length ? '' : !mixed ? ` ${sg(sP)} ${many ? 'Σ ' : ''}${P}` : few ? ord.map((p, i) => ` ${p.py > 0 ? '+' : MN} ${V('P', String(i + 1))}`).join('') : ` ${MN} Σ ${P}`;
      const pS = () => { if (!pts.length) return ''; if (!mixed) return ` ${sg(sP)} ${X1(Math.abs(sP))}`; if (!few) { exact = false; return ''; } return ord.map(p => ` ${p.py > 0 ? '+' : MN} ${X1(Math.abs(p.py))}`).join(''); };
      if (mixed) text += few ? ' The loads act both ways: each enters with the sign of its direction, in their order along the member.' : ' The loads act both ways: in Σ P a load that acts the other way counts negative.';
      rows.push(row(`${v2} = ${v1}${hasQ ? ` ${sg(qm)} ${qF}` : ''}${pF}`,
        sub(() => `${X1(V1)}${hasQ ? ` ${sg(qm)} ${qS()}` : ''}${pS()}`), V1 - qm * L - sP, 'kN', V2));
      const zr = pts.length ? [] : S.vZeros(M, 0, L);
      if (!pts.length && uni && zr.length === 1) {
        /* uniform load with V = 0 inside: the triangle of V up to that point gives the moment there */
        const xr = zr[0], xh = V1 / q1;
        rows.push(row(`${x0_} = ${fr(V1 < 0 ? `|${v1}|` : v1, w_)}`, sub(() => `${X1(Math.abs(V1))} / ${X1(a1)}`), xh, 'm', xr, { dec: 2 }));
        rows.push(row(`${V('M')}(${x0_}) = ${m1} + ${fr(`${v1}${D}${x0_}`, '2')}`, sub(() => `${X1(M1)} ${plus(V1)} ${D} ${X2(xh)} / 2`), M1 + V1 * xh / 2, 'kNm', F(xr).M));
        x0 = 1; turn = turnAt(xr);
